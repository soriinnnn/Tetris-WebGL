<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="alumne" content="Sorin Chiperi Arnaut">
    <meta name="codi" content="u1987503">
    <meta charset="UTF-8">
    <title>Tetris</title>

    <link rel="stylesheet" href="tetris.css">
    <script src="main.js"></script>
    <script src="tetris.js"></script>
    <script src="renderer.js"></script>
    <script src="gl-matrix-min.js"></script>

    <script id="vertexShader" type="x-shader/x-vertex"
    >#version 300 es

     uniform vec2 uniformOffset;
     uniform float uniformPointSize;
     in vec2 vertexPos;

     void main() {
         vec2 pos = vertexPos + uniformOffset;

         gl_Position = vec4(pos, 0.0, 1.0);
         gl_PointSize = uniformPointSize;
     }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment"
    >#version 300 es

     precision mediump float;
     uniform vec4 uniformColor;
     out vec4 fragColor;

     void main() {
         fragColor = uniformColor;
     }
    </script>
</head>

<body>
    <div id="appLayout">
        <aside id="controlsHelp">
            <h2>Controls</h2>
            <ul>
                <li><span>Arrow Left</span><small>Move left</small></li>
                <li><span>Arrow Right</span><small>Move right</small></li>
                <li><span>Arrow Down</span><small>Soft drop</small></li>
                <li><span>Arrow Up</span><small>Rotate piece</small></li>
                <li><span>Space</span><small>Hard drop</small></li>
            </ul>
        </aside>

        <div id="gameContainer">
            <div id="controls">
                <button id="startButton">Start Game</button>
                <button id="pauseButton" disabled>Pause</button>
                <button id="restartButton" disabled>Restart</button>
            </div>

            <canvas id="tetrisCanvas" width="400" height="800">
                El navegador no suporta HTML5.
            </canvas>
        </div>
    </div>
</body>

</html>
